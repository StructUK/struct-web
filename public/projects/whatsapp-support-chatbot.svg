<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 780" font-family="DM Sans, Arial, sans-serif">
  <rect width="1500" height="780" fill="#0d0d0d"/>
  <text x="30" y="30" fill="#3DBF3D" font-family="Syne, Arial, sans-serif" font-size="20" font-weight="700">WhatsApp AI Support Chatbot — workflow diagram</text>

  <!-- Lane 1: Load Knowledge Base -->
  <text x="30" y="60" fill="#3DBF3D" font-size="13" font-weight="700">1. LOAD KNOWLEDGE BASE (run once, manually)</text>
  <line x1="30" y1="68" x2="1470" y2="68" stroke="#2A9D2A" stroke-width="1" opacity="0.4"/>

  <g font-size="12" fill="#e8e8e8">
    <rect x="30" y="80" width="140" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="100" y="103" text-anchor="middle" font-weight="600">Manual Trigger</text>
    <text x="100" y="120" text-anchor="middle" font-size="10" fill="#9a9a9a">click to (re)index</text>

    <rect x="200" y="80" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="275" y="103" text-anchor="middle" font-weight="600">Google Sheets</text>
    <text x="275" y="120" text-anchor="middle" font-size="10" fill="#9a9a9a">Read FAQ Sheet</text>

    <rect x="380" y="80" width="130" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="445" y="103" text-anchor="middle" font-weight="600">Limit</text>
    <text x="445" y="120" text-anchor="middle" font-size="10" fill="#9a9a9a">To One</text>

    <rect x="540" y="80" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="615" y="103" text-anchor="middle" font-weight="600">Supabase</text>
    <text x="615" y="120" text-anchor="middle" font-size="10" fill="#9a9a9a">Clear Existing KB</text>

    <rect x="720" y="80" width="160" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="800" y="103" text-anchor="middle" font-weight="600">Code</text>
    <text x="800" y="120" text-anchor="middle" font-size="10" fill="#9a9a9a">Build FAQ Documents</text>

    <rect x="900" y="80" width="190" height="55" rx="8" fill="#132313" stroke="#3DBF3D" stroke-width="2"/>
    <text x="995" y="103" text-anchor="middle" font-weight="700" fill="#3DBF3D">Supabase Vector Store</text>
    <text x="995" y="120" text-anchor="middle" font-size="10" fill="#9a9a9a">insert · namespace whatsapp_support_kb</text>

    <rect x="720" y="190" width="190" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="815" y="213" text-anchor="middle" font-weight="600">Text Splitter</text>
    <text x="815" y="230" text-anchor="middle" font-size="10" fill="#9a9a9a">Recursive Character</text>

    <rect x="930" y="190" width="160" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1010" y="213" text-anchor="middle" font-weight="600">Default Data Loader</text>
    <text x="1010" y="230" text-anchor="middle" font-size="10" fill="#9a9a9a">ai_document</text>

    <rect x="1110" y="190" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1185" y="213" text-anchor="middle" font-weight="600">Embeddings OpenAI</text>
    <text x="1185" y="230" text-anchor="middle" font-size="10" fill="#9a9a9a">ai_embedding</text>
  </g>

  <g stroke="#2A9D2A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M170,107 L200,107"/>
    <path d="M350,107 L380,107"/>
    <path d="M510,107 L540,107"/>
    <path d="M690,107 L720,107"/>
    <path d="M880,107 L900,107"/>
    <path d="M910,190 L910,150 L960,150 L960,135"/>
    <path d="M1010,190 L1010,135"/>
    <path d="M1185,190 L1185,135"/>
  </g>

  <!-- Lane 2: Answer Incoming WhatsApp Messages -->
  <text x="30" y="285" fill="#3DBF3D" font-size="13" font-weight="700">2. ANSWER INCOMING WHATSAPP MESSAGES (every inbound message)</text>
  <line x1="30" y1="293" x2="1470" y2="293" stroke="#2A9D2A" stroke-width="1" opacity="0.4"/>

  <g font-size="12" fill="#e8e8e8">
    <rect x="30" y="305" width="170" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="115" y="328" text-anchor="middle" font-weight="600">Webhook</text>
    <text x="115" y="345" text-anchor="middle" font-size="10" fill="#9a9a9a">Twilio inbound message</text>

    <rect x="220" y="305" width="140" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="290" y="328" text-anchor="middle" font-weight="600">Set</text>
    <text x="290" y="345" text-anchor="middle" font-size="10" fill="#9a9a9a">Extract Fields</text>

    <rect x="380" y="305" width="160" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="460" y="328" text-anchor="middle" font-weight="600">Supabase</text>
    <text x="460" y="345" text-anchor="middle" font-size="10" fill="#9a9a9a">Lookup Active Handoff</text>

    <rect x="560" y="305" width="160" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="640" y="328" text-anchor="middle" font-weight="600">Code</text>
    <text x="640" y="345" text-anchor="middle" font-size="10" fill="#9a9a9a">Check Handoff Window</text>

    <rect x="740" y="305" width="120" height="55" rx="8" fill="#132313" stroke="#3DBF3D" stroke-width="2"/>
    <text x="800" y="328" text-anchor="middle" font-weight="700" fill="#3DBF3D">If</text>
    <text x="800" y="345" text-anchor="middle" font-size="10" fill="#9a9a9a">Active Handoff?</text>

    <rect x="900" y="305" width="150" height="55" rx="8" fill="#132313" stroke="#3DBF3D" stroke-width="2"/>
    <text x="975" y="328" text-anchor="middle" font-weight="700" fill="#3DBF3D">AI Agent</text>
    <text x="975" y="345" text-anchor="middle" font-size="10" fill="#9a9a9a">Support Agent</text>

    <rect x="1090" y="305" width="170" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1175" y="328" text-anchor="middle" font-weight="600">HTTP Request</text>
    <text x="1175" y="345" text-anchor="middle" font-size="10" fill="#9a9a9a">Send WhatsApp Reply</text>

    <rect x="760" y="420" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="835" y="443" text-anchor="middle" font-weight="600">OpenAI Chat Model</text>
    <text x="835" y="460" text-anchor="middle" font-size="10" fill="#9a9a9a">gpt-4o-mini</text>

    <rect x="920" y="420" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="995" y="443" text-anchor="middle" font-weight="600">Postgres Chat Memory</text>
    <text x="995" y="460" text-anchor="middle" font-size="10" fill="#9a9a9a">session = phone number</text>

    <rect x="1080" y="420" width="160" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1160" y="443" text-anchor="middle" font-weight="600">Search Knowledge Base</text>
    <text x="1160" y="460" text-anchor="middle" font-size="10" fill="#9a9a9a">Supabase Vector Store (tool)</text>

    <rect x="1250" y="420" width="170" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1335" y="443" text-anchor="middle" font-weight="600">Request Human Handoff</text>
    <text x="1335" y="460" text-anchor="middle" font-size="10" fill="#9a9a9a">Call n8n Sub-Workflow</text>

    <rect x="1080" y="520" width="160" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1160" y="543" text-anchor="middle" font-weight="600">Embeddings OpenAI</text>
    <text x="1160" y="560" text-anchor="middle" font-size="10" fill="#9a9a9a">ai_embedding</text>
  </g>

  <g stroke="#2A9D2A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M200,332 L220,332"/>
    <path d="M360,332 L380,332"/>
    <path d="M540,332 L560,332"/>
    <path d="M720,332 L740,332"/>
    <path d="M860,332 L900,332"/>
    <path d="M1050,332 L1090,332"/>
    <path d="M835,420 L835,375"/>
    <path d="M995,420 L995,375"/>
    <path d="M1160,420 L1160,375"/>
    <path d="M1335,420 L1335,375"/>
    <path d="M1160,520 L1160,475"/>
  </g>
  <g font-size="10" fill="#6a6a6a">
    <text x="800" y="400" text-anchor="middle">true → stay quiet (dead end)</text>
  </g>
  <path d="M800,360 L800,395" stroke="#2A9D2A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Lane 3: Human Handoff Handler -->
  <text x="30" y="605" fill="#3DBF3D" font-size="13" font-weight="700">3. HUMAN HANDOFF HANDLER (invoked as a tool by lane 2's agent)</text>
  <line x1="30" y1="613" x2="1470" y2="613" stroke="#2A9D2A" stroke-width="1" opacity="0.4"/>

  <g font-size="12" fill="#e8e8e8">
    <rect x="30" y="625" width="170" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="115" y="648" text-anchor="middle" font-weight="600">Execute Workflow Trigger</text>
    <text x="115" y="665" text-anchor="middle" font-size="10" fill="#9a9a9a">phone_number, reason</text>

    <rect x="220" y="625" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="295" y="648" text-anchor="middle" font-weight="600">Supabase</text>
    <text x="295" y="665" text-anchor="middle" font-size="10" fill="#9a9a9a">Insert Handoff Row</text>

    <rect x="390" y="625" width="130" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="455" y="648" text-anchor="middle" font-weight="600">Send Email</text>
    <text x="455" y="665" text-anchor="middle" font-size="10" fill="#9a9a9a">Notify Email</text>

    <rect x="540" y="625" width="130" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="605" y="648" text-anchor="middle" font-weight="600">Slack</text>
    <text x="605" y="665" text-anchor="middle" font-size="10" fill="#9a9a9a">Notify Slack</text>

    <rect x="690" y="625" width="130" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="755" y="648" text-anchor="middle" font-weight="600">Twilio</text>
    <text x="755" y="665" text-anchor="middle" font-size="10" fill="#9a9a9a">Notify SMS</text>

    <rect x="840" y="625" width="160" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="920" y="648" text-anchor="middle" font-weight="600">Set</text>
    <text x="920" y="665" text-anchor="middle" font-size="10" fill="#9a9a9a">Build Tool Response</text>
  </g>

  <g stroke="#2A9D2A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M200,652 L220,652"/>
    <path d="M370,652 L390,652"/>
    <path d="M520,652 L540,652"/>
    <path d="M670,652 L690,652"/>
    <path d="M820,652 L840,652"/>
  </g>

  <path d="M1335,475 L1335,540 L115,540 L115,625" stroke="#3DBF3D" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="535" fill="#6a6a6a" font-size="10" text-anchor="middle">calls as a tool</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2A9D2A"/>
    </marker>
  </defs>

  <text x="30" y="760" fill="#6a6a6a" font-size="11">Diagram generated from the exported workflow JSON — not a live n8n canvas screenshot (browser capture unavailable in this build).</text>
</svg>
