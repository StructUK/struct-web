  <text x="30" y="585" fill="#3DBF3D" font-size="14" font-weight="700">2. POSTING ADAPTER (sub-workflow, called once per platform in the payload list)</text>
  <line x1="30" y1="595" x2="3130" y2="595" stroke="#2A9D2A" stroke-width="1" opacity="0.4"/>

  <g font-size="12" fill="#e8e8e8">
    <rect x="30" y="720" width="220" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="140" y="743" text-anchor="middle" font-weight="600">Execute Workflow Trigger</text>
    <text x="140" y="760" text-anchor="middle" font-size="10" fill="#9a9a9a">When Called By Main Pipeline</text>

    <rect x="270" y="720" width="150" height="55" rx="8" fill="#132313" stroke="#3DBF3D" stroke-width="2"/>
    <text x="345" y="743" text-anchor="middle" font-weight="700" fill="#3DBF3D">Switch</text>
    <text x="345" y="760" text-anchor="middle" font-size="10" fill="#9a9a9a">Route By Provider</text>

    <rect x="470" y="630" width="130" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="535" y="653" text-anchor="middle" font-weight="600">HTTP Request</text>
    <text x="535" y="670" text-anchor="middle" font-size="10" fill="#9a9a9a">POST to Postiz</text>

    <rect x="630" y="630" width="200" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="730" y="653" text-anchor="middle" font-weight="600">Code</text>
    <text x="730" y="670" text-anchor="middle" font-size="10" fill="#9a9a9a">Normalize Postiz Response</text>

    <rect x="470" y="720" width="160" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="550" y="743" text-anchor="middle" font-weight="600">HTTP Request</text>
    <text x="550" y="760" text-anchor="middle" font-size="10" fill="#9a9a9a">POST to Upload-Post</text>

    <rect x="650" y="720" width="230" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="765" y="743" text-anchor="middle" font-weight="600">Code</text>
    <text x="765" y="760" text-anchor="middle" font-size="10" fill="#9a9a9a">Normalize Upload-Post Response</text>

    <rect x="470" y="810" width="130" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="535" y="833" text-anchor="middle" font-weight="600">HTTP Request</text>
    <text x="535" y="850" text-anchor="middle" font-size="10" fill="#9a9a9a">POST to Blotato</text>

    <rect x="630" y="810" width="210" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
