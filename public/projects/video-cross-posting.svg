<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3160 930" font-family="DM Sans, Arial, sans-serif">
  <rect width="3160" height="930" fill="#0d0d0d"/>
  <text x="30" y="40" fill="#3DBF3D" font-family="Syne, Arial, sans-serif" font-size="22" font-weight="700">Video Cross-Posting Framework — workflow diagram</text>

  <text x="30" y="75" fill="#3DBF3D" font-size="14" font-weight="700">1. MAIN PIPELINE (Stages A–E) — triggered once per video dropped in the watched Drive folder</text>
  <line x1="30" y1="85" x2="3130" y2="85" stroke="#2A9D2A" stroke-width="1" opacity="0.4"/>

  <g font-size="12" fill="#e8e8e8">
    <!-- Row 1: approval chain (upper branch) -->
    <rect x="1330" y="110" width="170" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1415" y="133" text-anchor="middle" font-weight="600">Send Email</text>
    <text x="1415" y="150" text-anchor="middle" font-size="10" fill="#9a9a9a">Send Approval Request</text>

    <rect x="1530" y="110" width="200" height="55" rx="8" fill="#132313" stroke="#3DBF3D" stroke-width="2"/>
    <text x="1630" y="133" text-anchor="middle" font-weight="700" fill="#3DBF3D">Wait</text>
    <text x="1630" y="150" text-anchor="middle" font-size="10" fill="#9a9a9a">For Approval Decision</text>

    <rect x="1760" y="110" width="120" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1820" y="133" text-anchor="middle" font-weight="600">If</text>
    <text x="1820" y="150" text-anchor="middle" font-size="10" fill="#9a9a9a">Approved?</text>

    <!-- Row 2: rejected dead-end -->
    <rect x="1600" y="205" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1675" y="228" text-anchor="middle" font-weight="600">Code</text>
    <text x="1675" y="245" text-anchor="middle" font-size="10" fill="#9a9a9a">Prepare Rejected Log Row</text>

    <rect x="1770" y="205" width="140" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1840" y="228" text-anchor="middle" font-weight="600">Google Sheets</text>
    <text x="1840" y="245" text-anchor="middle" font-size="10" fill="#9a9a9a">Log Rejected</text>

    <!-- Row 3: trunk -->
    <rect x="30" y="300" width="200" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="130" y="323" text-anchor="middle" font-weight="600">Google Drive Trigger</text>
    <text x="130" y="340" text-anchor="middle" font-size="10" fill="#9a9a9a">New Video In Drive</text>

    <rect x="250" y="300" width="110" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="305" y="323" text-anchor="middle" font-weight="600">Set</text>
    <text x="305" y="340" text-anchor="middle" font-size="10" fill="#9a9a9a">Config</text>

    <rect x="390" y="300" width="170" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="475" y="323" text-anchor="middle" font-weight="600">Google Sheets</text>
    <text x="475" y="340" text-anchor="middle" font-size="10" fill="#9a9a9a">Read Content Calendar</text>

    <rect x="590" y="300" width="160" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="670" y="323" text-anchor="middle" font-weight="600">Code</text>
    <text x="670" y="340" text-anchor="middle" font-size="10" fill="#9a9a9a">Match Calendar Row</text>

    <rect x="770" y="300" width="120" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="830" y="323" text-anchor="middle" font-weight="600">If</text>
    <text x="830" y="340" text-anchor="middle" font-size="10" fill="#9a9a9a">Row Found?</text>

    <rect x="920" y="300" width="190" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1015" y="323" text-anchor="middle" font-weight="600">Code</text>
    <text x="1015" y="340" text-anchor="middle" font-size="10" fill="#9a9a9a">Build Platform Payloads</text>

    <rect x="1130" y="300" width="150" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1205" y="323" text-anchor="middle" font-weight="600">If</text>
    <text x="1205" y="340" text-anchor="middle" font-size="10" fill="#9a9a9a">Approval Required?</text>

    <!-- Row 4: dead-end + featured wait/alert branches -->
    <rect x="730" y="395" width="200" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="830" y="418" text-anchor="middle" font-weight="600">Send Email</text>
    <text x="830" y="435" text-anchor="middle" font-size="10" fill="#9a9a9a">Alert - No Calendar Entry</text>

    <rect x="1960" y="395" width="170" height="55" rx="8" fill="#132313" stroke="#3DBF3D" stroke-width="2"/>
    <text x="2045" y="418" text-anchor="middle" font-weight="700" fill="#3DBF3D">Wait</text>
    <text x="2045" y="435" text-anchor="middle" font-size="10" fill="#9a9a9a">Until Scheduled Time</text>

    <rect x="2735" y="395" width="190" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="2830" y="418" text-anchor="middle" font-weight="600">Send Email</text>
    <text x="2830" y="435" text-anchor="middle" font-size="10" fill="#9a9a9a">Alert - Posting Failures</text>

    <!-- Row 5: bottom trunk continuation -->
    <rect x="1735" y="490" width="170" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1820" y="513" text-anchor="middle" font-weight="600">If</text>
    <text x="1820" y="530" text-anchor="middle" font-size="10" fill="#9a9a9a">Scheduled For Future?</text>

    <rect x="1955" y="490" width="180" height="55" rx="8" fill="#132313" stroke="#3DBF3D" stroke-width="2"/>
    <text x="2045" y="513" text-anchor="middle" font-weight="700" fill="#3DBF3D">Execute Workflow</text>
    <text x="2045" y="530" text-anchor="middle" font-size="10" fill="#9a9a9a">Post To Platform</text>

    <rect x="2155" y="490" width="180" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="2245" y="513" text-anchor="middle" font-weight="600">Code</text>
    <text x="2245" y="530" text-anchor="middle" font-size="10" fill="#9a9a9a">Prepare Post Log Row</text>

    <rect x="2355" y="490" width="140" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="2425" y="513" text-anchor="middle" font-weight="600">Google Sheets</text>
    <text x="2425" y="530" text-anchor="middle" font-size="10" fill="#9a9a9a">Log Post Result</text>

    <rect x="2555" y="490" width="180" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="2645" y="513" text-anchor="middle" font-weight="600">Code</text>
    <text x="2645" y="530" text-anchor="middle" font-size="10" fill="#9a9a9a">Check For Any Failures</text>

    <rect x="2765" y="490" width="130" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="2830" y="513" text-anchor="middle" font-weight="600">If</text>
    <text x="2830" y="530" text-anchor="middle" font-size="10" fill="#9a9a9a">Any Failures?</text>

    <rect x="2935" y="490" width="180" height="55" rx="8" fill="#161616" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="3025" y="513" text-anchor="middle" font-weight="600">Google Sheets</text>
    <text x="3025" y="530" text-anchor="middle" font-size="10" fill="#9a9a9a">Update Calendar Status</text>
