    <path d="M1500,138 L1530,138"/>
    <path d="M1730,138 L1760,138"/>
    <path d="M1800,165 L1800,490"/>
    <path d="M1840,165 L1840,185 L1675,185 L1675,205"/>
    <path d="M1750,232 L1770,232"/>
